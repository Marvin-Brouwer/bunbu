name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      # The game imports @bunbu/data from its dist, so the postinstall script builds it first.
      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @bunbu/game exec playwright install --with-deps chromium

      # Starts the dev server itself (apps/game/playwright.config.mts).
      - run: pnpm e2e

      # The How to play video is CI's, filmed with its fonts: when it is out of date, it is filmed
      # again here, to download from the run and commit (apps/game/e2e/how-to-play-video.spec.mts).
      - id: film
        if: failure() && hashFiles('apps/game/test-results/how-to-play-video-*/**') != ''
        run: pnpm --filter @bunbu/game how-to-play-video

      - if: failure() && steps.film.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: how-to-play-video
          path: apps/game/public/guide/how-to-play.*
