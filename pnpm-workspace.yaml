packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  # tsx -> esbuild: its install script only verifies the platform binary, which pnpm installs anyway.
  esbuild: false
minimumReleaseAgeExclude:
  # Fixes binary data in store state (Marvin-Brouwer/rooted#404); younger than the minimum release age when bumped.
  - '@rooted/store@1.0.0-alpha.14'
  # Pre-render leaves missing window properties undefined (Marvin-Brouwer/rooted#403); younger than the minimum release age when bumped.
  - '@rooted-adapters/github-pages@1.0.0-alpha.29'
  - '@rooted/adapter@1.0.0-alpha.29'
  - '@rooted/application@1.0.0-alpha.43'
  - '@rooted/prerender@1.0.0-alpha.2'
