<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 120">
	<!-- How to play, the run: the samurai running down the path to a torii at dusk. -->
	<defs>
		<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#2c2458"/>
			<stop offset="1" stop-color="#e88a5a"/>
		</linearGradient>
	</defs>
	<rect width="320" height="120" fill="url(#sky)"/>
	<circle cx="236" cy="58" r="20" fill="#f4c06a" opacity="0.9"/>
	<!-- Hills, near ones darker. -->
	<path d="M0 74 L46 54 L92 70 L150 50 L214 72 L262 56 L320 70 V120 H0 Z" fill="#7a5a6a"/>
	<path d="M0 84 L60 70 L130 82 L200 68 L270 80 L320 74 V120 H0 Z" fill="#4f3a48"/>
	<!-- The ground and the path running into the distance. -->
	<rect y="86" width="320" height="34" fill="#3e352f"/>
	<path d="M150 86 H170 L220 120 H100 Z" fill="#a49d90"/>
	<!-- The torii far down the path. -->
	<g fill="#a8261c">
		<rect x="152" y="66" width="2.6" height="20"/>
		<rect x="165.4" y="66" width="2.6" height="20"/>
		<rect x="148" y="64" width="24" height="3" rx="1"/>
		<rect x="150" y="70" width="20" height="1.8"/>
	</g>
	<!-- The samurai from behind, running: helmet with its crest, armour, a blade at his side. -->
	<g fill="#1f1c18">
		<path d="M155 93 L159 84 L163 93 Z"/>
		<circle cx="160" cy="96" r="5.5"/>
		<path d="M151 101 Q160 98 169 101 L167 113 H153 Z"/>
		<rect x="153" y="112" width="5" height="8" rx="1.5" transform="rotate(10 155 112)"/>
		<rect x="162" y="112" width="5" height="8" rx="1.5" transform="rotate(-14 164 112)"/>
		<path d="M169 104 L182 112" stroke="#1f1c18" stroke-width="1.6" stroke-linecap="round"/>
	</g>
	<path d="M151 101 Q160 98 169 101 L168 104 Q160 101.5 152 104 Z" fill="#a8261c"/>
</svg>
