<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 120">
	<!-- The Practice card's art: the training dummy of the practice start (dojo/world.mts), with its bamboo sword, in front of the dojo's paper walls. -->
	<rect width="320" height="120" fill="#4a3426"/>
	<!-- Shoji panels lit from behind, between dark posts. -->
	<g fill="#f4ead2">
		<rect x="4" y="6" width="58" height="84"/>
		<rect x="68" y="6" width="58" height="84"/>
		<rect x="132" y="6" width="58" height="84"/>
		<rect x="196" y="6" width="58" height="84"/>
		<rect x="260" y="6" width="58" height="84"/>
	</g>
	<g stroke="#8a6a4a" stroke-width="1.2">
		<path d="M4 34 H318 M4 62 H318 M23 6 V90 M43 6 V90 M87 6 V90 M107 6 V90 M151 6 V90 M171 6 V90 M215 6 V90 M235 6 V90 M279 6 V90 M299 6 V90"/>
	</g>
	<!-- The floorboards. -->
	<rect y="90" width="320" height="30" fill="#b08458"/>
	<path d="M0 100 H320 M0 110 H320" stroke="#8f6a44" stroke-width="1"/>
	<!-- The dummy's feet, its post and shadow. -->
	<ellipse cx="160" cy="111" rx="30" ry="4" fill="#5a3e24" opacity="0.45"/>
	<rect x="132" y="105" width="56" height="6" rx="1" fill="#8a5a36"/>
	<rect x="156" y="20" width="8" height="88" fill="#8a5a36"/>
	<!-- The arms: one bar through the shoulders. -->
	<rect x="124" y="44" width="72" height="6" rx="3" fill="#8a5a36"/>
	<!-- The straw body, bound with rope. -->
	<path d="M144 48 H176 L179 88 H141 Z" fill="#c9a964"/>
	<g fill="#6b4a2a">
		<rect x="142" y="53" width="36" height="3.5"/>
		<rect x="141.5" y="66" width="37" height="3.5"/>
		<rect x="141" y="79" width="38" height="3.5"/>
	</g>
	<!-- The cloth head with its red band. -->
	<circle cx="160" cy="30" r="12" fill="#e9e2d0"/>
	<rect x="148" y="25" width="24" height="5" fill="#8e2a22"/>
	<!-- The bamboo sword, held up across the body. -->
	<path d="M192 50 L232 6" stroke="#d8c27a" stroke-width="4" stroke-linecap="round"/>
	<g stroke="#6b4a2a" stroke-width="5">
		<path d="M206.5 34.5 l1.5 1.4 M216 24 l1.5 1.4 M225.5 13.5 l1.5 1.4"/>
	</g>
	<path d="M186 57 L193 49" stroke="#2a2420" stroke-width="5" stroke-linecap="round"/>
	<path d="M190 46 L198 53" stroke="#2a2420" stroke-width="3" stroke-linecap="round"/>
</svg>
