<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 120">
	<!-- How to play, the life bar: full is a perfect score still possible, empty is the pass mark out of reach; a miss takes its share. -->
	<rect width="320" height="120" fill="#f1e8d3"/>
	<g font-family="ui-monospace, Menlo, monospace" font-size="10" fill="#5b5348" letter-spacing="1">
		<text x="40" y="38">LIFE</text>
		<text x="280" y="38" text-anchor="end">empty = 70%</text>
	</g>
	<!-- The bar, its frame and what is left of it. -->
	<rect x="40" y="46" width="240" height="18" rx="2" fill="#e4d8bd" stroke="#1f1c18" stroke-width="2"/>
	<rect x="42" y="48" width="176" height="14" fill="#b3391f"/>
	<!-- The share a miss took, flashing and dropping off. -->
	<rect x="222" y="58" width="34" height="14" fill="#d9765f" transform="rotate(14 239 65)" opacity="0.85"/>
	<path d="M230 78 l3 6 M242 77 l2 7 M254 78 l-2 6" stroke="#b3391f" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
	<!-- What full and empty mean, under it. -->
	<g font-family="system-ui, sans-serif" font-size="11" fill="#1f1c18">
		<text x="40" y="104">100% still possible</text>
		<text x="280" y="104" text-anchor="end">pass mark out of reach</text>
	</g>
	<path d="M40 110 H130 M178 110 H280" stroke="#c9b48c" stroke-width="1.5"/>
</svg>
