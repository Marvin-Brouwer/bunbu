<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 400">
	<!--
		Endless, for its card on the fight setup: the path in a loop like ∞ through every stage in turn,
		the rice fields, the bamboo forest, the mountain temple, the castle town and Edo castle, at dusk,
		in the flat style of the guide's pictures (public/guide/).
	-->
	<defs>
		<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#2c2458"/>
			<stop offset="0.75" stop-color="#e88a5a"/>
			<stop offset="1" stop-color="#f2b27a"/>
		</linearGradient>
		<linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#5d6b3a"/>
			<stop offset="1" stop-color="#3a4226"/>
		</linearGradient>
	</defs>
	<rect width="320" height="400" fill="url(#sky)"/>
	<circle cx="160" cy="112" r="34" fill="#f4c06a" opacity="0.9"/>

	<!-- The mountain temple, far off: snowy peaks, a pagoda and its torii. -->
	<path d="M0 150 L58 96 L104 134 L160 72 L222 132 L268 100 L320 140 V190 H0 Z" fill="#7a5a6a"/>
	<path d="M144 86 L160 72 L176 86 L168 84 L160 78 L152 84 Z" fill="#f2ead8"/>
	<g fill="#3e2c2a">
		<rect x="155" y="118" width="10" height="22"/>
		<path d="M146 122 H174 L168 116 H152 Z"/>
		<path d="M148 112 H172 L166 106 H154 Z"/>
		<path d="M151 102 H169 L163 96 H157 Z"/>
		<rect x="159" y="90" width="2" height="7"/>
	</g>
	<g fill="#a8261c">
		<rect x="148" y="138" width="2.2" height="16"/>
		<rect x="169.8" y="138" width="2.2" height="16"/>
		<rect x="144" y="135" width="32" height="3" rx="1"/>
		<rect x="146" y="141" width="28" height="1.8"/>
	</g>

	<!-- Edo castle on the right: white walls on a stone base, tiers of dark roofs. -->
	<g>
		<path d="M226 176 L238 150 H290 L302 176 Z" fill="#8d877b"/>
		<rect x="242" y="128" width="44" height="22" fill="#f2ead8"/>
		<path d="M234 130 H294 L282 120 H246 Z" fill="#2f3a44"/>
		<rect x="250" y="106" width="28" height="15" fill="#f2ead8"/>
		<path d="M244 108 H284 L274 98 H254 Z" fill="#2f3a44"/>
		<rect x="257" y="88" width="14" height="11" fill="#f2ead8"/>
		<path d="M252 90 H276 L268 80 H260 Z" fill="#2f3a44"/>
		<g fill="#2f3a44">
			<rect x="248" y="134" width="4" height="5"/>
			<rect x="262" y="134" width="4" height="5"/>
			<rect x="276" y="134" width="4" height="5"/>
		</g>
	</g>

	<!-- The bamboo forest on the left: tall stalks with their joints, and leaves. -->
	<g stroke="#4f6b2f" stroke-width="5" stroke-linecap="round">
		<path d="M18 186 V96"/>
		<path d="M34 188 V80"/>
		<path d="M52 186 V104"/>
		<path d="M70 190 V90"/>
	</g>
	<g stroke="#2f4a20" stroke-width="5.4">
		<path d="M18 120 v2 M18 150 v2 M34 106 v2 M34 140 v2 M52 128 v2 M52 160 v2 M70 116 v2 M70 152 v2"/>
	</g>
	<g fill="#6f8f3a">
		<path d="M34 82 q-16 -4 -24 4 q12 2 24 -4 Z"/>
		<path d="M34 92 q16 -6 26 0 q-14 4 -26 0 Z"/>
		<path d="M70 92 q14 -8 26 -2 q-14 6 -26 2 Z"/>
		<path d="M18 98 q-10 -8 -18 -4 q8 6 18 4 Z"/>
		<path d="M52 106 q-12 -8 -22 -4 q10 6 22 4 Z"/>
	</g>

	<!-- The ground, and the path in a loop through all of it. -->
	<path d="M0 180 Q160 166 320 180 V400 H0 Z" fill="url(#ground)"/>

	<!-- The rice fields in the left loop: water between rows of young rice. -->
	<path d="M44 266 Q48 236 84 234 Q116 236 122 266 Q116 296 84 300 Q48 296 44 266 Z" fill="#8fb3b8"/>
	<g stroke="#5e8a2e" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="1 6">
		<path d="M56 246 H112"/>
		<path d="M50 256 H118"/>
		<path d="M48 266 H120"/>
		<path d="M50 276 H118"/>
		<path d="M56 286 H112"/>
	</g>

	<!-- The castle town in the right loop: two houses with a lantern-lit shop between. -->
	<g>
		<rect x="200" y="252" width="34" height="24" fill="#f2ead8"/>
		<path d="M194 254 H240 L230 240 H204 Z" fill="#3a3a44"/>
		<rect x="208" y="262" width="8" height="14" fill="#8a6240"/>
		<rect x="240" y="258" width="38" height="20" fill="#8a6240"/>
		<path d="M236 260 H282 L274 248 H244 Z" fill="#5c3d24"/>
		<g fill="#f4c06a">
			<circle cx="248" cy="264" r="2.4"/>
			<circle cx="259" cy="264" r="2.4"/>
			<circle cx="270" cy="264" r="2.4"/>
		</g>
		<rect x="244" y="268" width="30" height="10" fill="#f6d79a" opacity="0.8"/>
	</g>

	<!-- The path: ∞, sand between darker edges. -->
	<path d="M160 268 C 196 214, 300 210, 302 268 C 300 326, 196 322, 160 268 C 124 214, 20 210, 18 268 C 20 326, 124 322, 160 268 Z"
		fill="none" stroke="#6b5a44" stroke-width="22" stroke-linejoin="round"/>
	<path d="M160 268 C 196 214, 300 210, 302 268 C 300 326, 196 322, 160 268 C 124 214, 20 210, 18 268 C 20 326, 124 322, 160 268 Z"
		fill="none" stroke="#cdb48a" stroke-width="15" stroke-linejoin="round"/>

	<!-- Where the samurai runs: the path from the crossing down to him. -->
	<path d="M152 286 L144 400 H176 L168 286 Z" fill="#cdb48a"/>
	<path d="M152 286 L144 400 M168 286 L176 400" stroke="#6b5a44" stroke-width="3.5"/>
	<!-- The samurai running on toward the loop: helmet with its crest, armour, a blade. -->
	<g transform="translate(160 372)">
		<path d="M-4 -26 L0 -36 L4 -26 Z" fill="#1f1c18"/>
		<circle cy="-22" r="6" fill="#1f1c18"/>
		<path d="M-10 -16 Q0 -19 10 -16 L8 -2 H-8 Z" fill="#1f1c18"/>
		<path d="M-10 -16 Q0 -19 10 -16 L9 -12 Q0 -15 -9 -12 Z" fill="#a8261c"/>
		<rect x="-8" y="-3" width="5" height="10" rx="1.5" fill="#1f1c18" transform="rotate(12 -5 -3)"/>
		<rect x="3" y="-3" width="5" height="10" rx="1.5" fill="#1f1c18" transform="rotate(-16 5 -3)"/>
		<path d="M10 -12 L24 -2" stroke="#1f1c18" stroke-width="1.8" stroke-linecap="round"/>
	</g>
</svg>
