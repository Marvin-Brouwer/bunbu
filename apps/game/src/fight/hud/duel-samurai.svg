<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 64" fill="#18121a">
	<!-- The samurai from the side, facing right, walking: the duel strip's silhouette. -->
	<style>
		.leg { transform-box: fill-box; transform-origin: 50% 0; animation: swing 1.6s ease-in-out infinite alternate; }
		.back { animation-delay: -1.6s; }
		.body { animation: bob 0.8s ease-in-out infinite alternate; }
		@keyframes swing { from { transform: rotate(18deg); } to { transform: rotate(-18deg); } }
		@keyframes bob { to { transform: translateY(-1px); } }
		@media (prefers-reduced-motion: reduce) { .leg, .body { animation: none; } }
	</style>
	<rect class="leg back" x="18" y="44" width="6" height="18" rx="2"/>
	<g class="body">
		<path d="M11 38 L34 38 L36 49 L9 49 Z"/>
		<path d="M13 21 Q24 17 33 21 L34 39 L12 39 Z"/>
		<path d="M9 21 L17 21 L18 33 L8 32 Z"/>
		<circle cx="25" cy="14" r="5.5"/>
		<path d="M15 13 Q25 1 35 12 L38 15 L13 16 Z"/>
		<path d="M24 7 L19 -1 L22.5 7 Z M26 7 L31 -1 L27.5 7 Z"/>
		<path d="M27 31 L31 28" stroke="#18121a" stroke-width="3" stroke-linecap="round"/>
		<path d="M31 28 L46 17" stroke="#18121a" stroke-width="1.8" stroke-linecap="round"/>
		<path d="M24 25 L29 30" stroke="#18121a" stroke-width="4" stroke-linecap="round"/>
	</g>
	<rect class="leg" x="23" y="44" width="6" height="18" rx="2"/>
</svg>
