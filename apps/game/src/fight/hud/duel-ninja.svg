<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 64" fill="#18121a">
	<!-- A ninja from the side, facing right, creeping in: the duel strip's silhouette. -->
	<style>
		.leg { transform-box: fill-box; transform-origin: 50% 0; animation: swing 1.6s ease-in-out infinite alternate; }
		.back { animation-delay: -1.6s; }
		.body { animation: bob 0.8s ease-in-out infinite alternate; }
		@keyframes swing { from { transform: rotate(18deg); } to { transform: rotate(-18deg); } }
		@keyframes bob { to { transform: translateY(-1px); } }
		@media (prefers-reduced-motion: reduce) { .leg, .body { animation: none; } }
	</style>
	<rect class="leg back" x="18" y="42" width="6" height="20" rx="2"/>
	<g class="body">
		<path d="M12 23 L22 3" stroke="#18121a" stroke-width="2.4" stroke-linecap="round"/>
		<path d="M14 24 Q25 18 35 24 L33 44 L13 44 Z"/>
		<circle cx="28" cy="15" r="6.5"/>
		<path d="M22 12 L11 7 L12 11 L22 15 Z"/>
		<path d="M30 27 L40 31" stroke="#18121a" stroke-width="4" stroke-linecap="round"/>
		<path d="M40 31 L46 28 L44 32 Z"/>
	</g>
	<rect class="leg" x="23" y="42" width="6" height="20" rx="2"/>
</svg>
