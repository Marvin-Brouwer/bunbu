<!DOCTYPE html>
<html lang="en">

	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Bunbu</title>
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<link rel="apple-touch-icon" href="/app-icon.png" />
		<script crossorigin type="module" src="/src/application.mts"></script>
		<!--
			The loading screen (docs/design/screens.md#0-loading): here in the page, so it shows from the
			first paint, before the app's own styles. The app fades it out once the first screen has
			settled (src/_shared/loading.mts).
		-->
		<style>
			html { background: #f1e8d3; }
			#opening {
				position: fixed;
				inset: 0;
				z-index: 100;
				display: grid;
				place-content: center;
				justify-items: center;
				gap: 1.6rem;
				background: #f1e8d3;
				color: #1f1c18;
				transition: opacity 0.4s ease-out;
			}
			#opening.settled { opacity: 0; pointer-events: none; }
			#opening svg { width: min(12rem, 45vmin); }
			#opening .sun { animation: rise 2.4s ease-in-out infinite alternate; }
			#opening .name {
				display: flex;
				align-items: baseline;
				gap: 0.75rem;
				margin: 0;
				font: 700 1.9rem 'Hiragino Mincho ProN', 'Yu Mincho', 'Noto Serif JP', Georgia, serif;
			}
			#opening .scholar {
				font: 0.8rem ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace;
				letter-spacing: 0.12em;
				color: #5b5348;
			}
			/* The sun rises behind the torii and sinks again while the game loads. */
			@keyframes rise { from { transform: translateY(70px); } to { transform: none; } }
			@media (prefers-reduced-motion: reduce) { #opening .sun { animation: none; } }
		</style>
	</head>

	<body>
		<div id="app" inert></div>
		<div id="opening" role="status" aria-label="Loading">
			<svg viewBox="0 0 512 512" aria-hidden="true">
				<!-- The app icon (public/icon.svg): the torii in ink against a red sun. -->
				<clipPath id="loading-sky"><rect width="512" height="404" /></clipPath>
				<g clip-path="url(#loading-sky)"><circle class="sun" cx="256" cy="236" r="150" fill="#b3391f" /></g>
				<g fill="#1f1c18">
					<path d="M70 151 Q256 177 442 151 L424 185 Q256 203 88 185 Z" />
					<rect x="112" y="190" width="288" height="15" />
					<rect x="115" y="239" width="282" height="18" />
					<rect x="245.5" y="198" width="21" height="46" />
					<path d="M148 198 L175 198 L181 404 L145 404 Z" />
					<path d="M337 198 L364 198 L367 404 L331 404 Z" />
					<rect x="40" y="402" width="432" height="6" rx="3" />
				</g>
			</svg>
			<p class="name"><span lang="ja">文武</span><span>Bunbu</span></p>
			<span class="scholar">SHOGUN SCHOLAR</span>
		</div>
	</body>

</html>
